name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Code Quality & Testing
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Lint with flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Format check with black
      run: |
        black --check src/
    
    - name: Type check with mypy
      run: |
        pip install mypy types-requests
        mypy src/ --ignore-missing-imports || true
    
    - name: Run unit tests
      run: |
        pytest tests/ --cov=src --cov-report=xml --cov-report=term
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  # Job 2: Data Validation
  data-validation:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install pandas pyyaml
    
    - name: Validate data schemas
      run: |
        python -c "
        import pandas as pd
        import sys
        
        # Check if processed data exists
        try:
            train_df = pd.read_csv('data/processed/train.csv')
            val_df = pd.read_csv('data/processed/val.csv')
            test_df = pd.read_csv('data/processed/test.csv')
            
            print(f'✓ Train: {len(train_df)} samples')
            print(f'✓ Val: {len(val_df)} samples')
            print(f'✓ Test: {len(test_df)} samples')
            
            # Validate columns
            required_cols = ['text', 'label']
            for df, name in [(train_df, 'train'), (val_df, 'val'), (test_df, 'test')]:
                if not all(col in df.columns for col in required_cols):
                    print(f'✗ {name} missing required columns')
                    sys.exit(1)
            
            print('✓ All datasets validated')
        except FileNotFoundError:
            print('⚠ Processed data not found, skipping validation')
        "

  # Job 3: Model Training (on schedule or manual)
  train-model:
    runs-on: ubuntu-latest
    needs: [test, data-validation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Train model
      env:
        MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      run: |
        # Train model if data exists
        if [ -f "data/processed/train.csv" ]; then
          python src/models/train.py \
            --config configs/training_config.yaml \
            --epochs 3
        else
          echo "⚠ Training data not found, skipping"
        fi
    
    - name: Upload model artifacts
      uses: actions/upload-artifact@v3
      with:
        name: trained-model
        path: models/
        retention-days: 30

  # Job 4: Docker Build & Security Scan
  docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build API Docker image
      run: |
        docker build -f docker/Dockerfile.api -t sentiment-api:latest .
    
    - name: Run Trivy security scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'sentiment-api:latest'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  # Job 5: API Integration Tests
  integration-test:
    runs-on: ubuntu-latest
    needs: docker
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      
      kafka:
        image: confluentinc/cp-kafka:7.5.0
        ports:
          - 9092:9092
        env:
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Run API integration tests
      run: |
        # Start API in background
        uvicorn src.api.main:app --host 0.0.0.0 --port 8000 &
        sleep 10
        
        # Test health endpoint
        curl http://localhost:8000/health
        
        # Test metrics endpoint
        curl http://localhost:8000/metrics

  # Job 6: Deployment (to staging/production)
  deploy:
    runs-on: ubuntu-latest
    needs: [train-model, integration-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to Fly.io
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      run: |
        curl -L https://fly.io/install.sh | sh
        export FLYCTL_INSTALL="/home/runner/.fly"
        export PATH="$FLYCTL_INSTALL/bin:$PATH"
        
        # Deploy if fly.toml exists
        if [ -f "fly.toml" ]; then
          flyctl deploy --remote-only || echo "⚠ Fly.io deployment skipped"
        fi
