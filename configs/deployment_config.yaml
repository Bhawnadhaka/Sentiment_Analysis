# Deployment Configuration

# API Settings
api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  reload: false
  log_level: "info"

# Model Settings
model:
  path: "models/best_distilbert_model.pth"
  type: "distilbert"
  device: "cpu"  # Options: cpu, cuda

# Kafka Settings
kafka:
  enabled: true
  bootstrap_servers: "localhost:9092"
  topic: "sentiment-predictions"
  consumer_group: "sentiment-consumer-group"

# Database Settings
database:
  url: "sqlite:///./sentiment_predictions.db"
  # For PostgreSQL: "postgresql://user:pass@localhost:5432/sentiment_db"
  pool_size: 10
  max_overflow: 20

# Monitoring
monitoring:
  enabled: true
  metrics_file: "monitoring/metrics_history.json"
  drift_detection_enabled: true
  alert_thresholds:
    accuracy: 0.75
    f1: 0.70
    confidence: 0.60
    drift_score: 0.3

# Logging
logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {message}"
  file: "logs/app.log"
  rotation: "100 MB"
  retention: "10 days"
