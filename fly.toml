# Fly.io Configuration for FREE tier deployment
# Free tier includes: 3 shared-cpu-1x VMs, 3GB storage, 160GB bandwidth

app = "sentiment-analysis-mlops"
primary_region = "iad"  # Change to your preferred region (iad=US East, lhr=London, sin=Singapore)

[build]
  dockerfile = "docker/Dockerfile.api"

[env]
  MODEL_TYPE = "bow"
  MODEL_PATH = "/app/models/best_bow_model.pth"
  KAFKA_ENABLED = "false"  # Disable Kafka for simple deployment
  REDIS_HOST = "localhost"
  REDIS_PORT = "6379"
  CACHE_ENABLED = "true"

[[services]]
  http_checks = []
  internal_port = 8000
  processes = ["app"]
  protocol = "tcp"
  script_checks = []

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
    type = "connections"

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "10s"
    interval = "15s"
    restart_limit = 0
    timeout = "5s"

  [[services.http_checks]]
    interval = "30s"
    grace_period = "10s"
    method = "get"
    path = "/health"
    protocol = "http"
    timeout = "5s"
    tls_skip_verify = false

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
